<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AOI 九宮格 Demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0d15;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #fps-overlay {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 30000;
        pointer-events: none;
        font-family: monospace;
        font-size: 14px;
        padding: 2px 4px;
        background: #000a;
      }
      #fps-overlay .fps-stats {
        font-size: 11px;
        opacity: 0.7;
        margin-top: 2px;
      }
      #fps-overlay.fps-good {
        color: #8f8;
      }
      #fps-overlay.fps-mid {
        color: #ff0;
      }
      #fps-overlay.fps-bad {
        color: #f55;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="fps-overlay">FPS: --</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
