<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AOI 九宮格 Demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d0d15;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #fps-overlay {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 30000;
        pointer-events: none;
        font-family: monospace;
        font-size: 14px;
        padding: 2px 4px;
        background: #000a;
      }
      #fps-overlay.fps-good {
        color: #8f8;
      }
      #fps-overlay.fps-mid {
        color: #ff0;
      }
      #fps-overlay.fps-bad {
        color: #f55;
      }
      #virtual-joystick {
        position: absolute;
        left: 24px;
        bottom: 24px;
        width: 120px;
        height: 120px;
        z-index: 30000;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #virtual-joystick .vj-base {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid rgba(255, 255, 255, 0.28);
        box-sizing: border-box;
      }
      #virtual-joystick .vj-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        margin: -26px 0 0 -26px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.35);
        border: 2px solid rgba(255, 255, 255, 0.55);
        box-sizing: border-box;
        transform: translate(0, 0);
        pointer-events: none;
        transition: background 0.12s ease;
      }
      #virtual-joystick.is-active .vj-knob {
        background: rgba(255, 255, 255, 0.55);
      }
      @media (max-width: 640px) {
        #virtual-joystick {
          left: 16px;
          bottom: 16px;
          width: 108px;
          height: 108px;
        }
        #virtual-joystick .vj-knob {
          width: 46px;
          height: 46px;
          margin: -23px 0 0 -23px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="fps-overlay">FPS: --</div>
    <div id="virtual-joystick" aria-hidden="true">
      <div class="vj-base"></div>
      <div class="vj-knob"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
