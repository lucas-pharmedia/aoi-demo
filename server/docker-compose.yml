services:
  mmo-test-server:
    build: .
    container_name: mmo-test-server
    ports:
      - "8088:8088"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8088"
      MAP_WIDTH: ${MAP_WIDTH:-5056}
      MAP_HEIGHT: ${MAP_HEIGHT:-3360}
      GRID_COLS: ${GRID_COLS:-8}
      GRID_ROWS: ${GRID_ROWS:-5}
      TICK_RATE: ${TICK_RATE:-3}
      MAX_AOI_CAP: ${MAX_AOI_CAP:-100}
    restart: unless-stopped
